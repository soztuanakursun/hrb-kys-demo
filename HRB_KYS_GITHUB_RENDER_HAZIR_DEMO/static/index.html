<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HRB KYS | Kurgusal Demo</title><style>
:root{--green:#126b61;--mint:#e9f5f1;--ink:#243c40;--border:#dce8e4;--muted:#6d8282}*{box-sizing:border-box}body{margin:0;background:#f5f8f7;color:var(--ink);font:14px/1.5 Arial,sans-serif}header{background:#fff;border-bottom:1px solid var(--border);padding:17px 30px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:800;letter-spacing:1.1px;color:var(--green)}.brand small{display:block;color:#879a9b;font-size:10px;letter-spacing:2px}nav{display:flex;gap:7px;flex-wrap:wrap;padding:18px 28px;background:white;border-bottom:1px solid var(--border)}nav button{border:0;background:transparent;color:#617576;padding:11px 13px;font-size:12px;font-weight:700;cursor:pointer;border-radius:8px}nav button.active{background:var(--mint);color:var(--green)}main{max-width:1350px;margin:auto;padding:25px 28px}h1{font-size:24px;margin:4px 0 6px}h2{font-size:17px;margin:0 0 15px}h3{font-size:14px;margin:10px 0}.sub{color:var(--muted);margin-bottom:24px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:22px 0}.card,.stat{background:white;border:1px solid var(--border);border-radius:13px;padding:22px;box-shadow:0 2px 7px #103b3610}.stat b{display:block;color:var(--green);font-size:30px}.stat span{font-size:11px;letter-spacing:1px;color:var(--muted);font-weight:700}.row{display:flex;gap:16px;align-items:flex-start}.row>*{flex:1;min-width:0}.btn{background:var(--green);border:1px solid var(--green);color:white;border-radius:7px;padding:10px 14px;cursor:pointer;font-weight:700;font-size:12px}.btn.secondary{background:white;color:var(--green)}.btn.danger{background:#a64242;border-color:#a64242}.btn:disabled{opacity:.5}input,select,textarea{padding:11px;border:1px solid #cbdcd7;border-radius:7px;font:inherit;max-width:100%;width:100%}textarea{min-height:95px}label{font-size:12px;font-weight:700;display:block;margin:10px 0 5px}.check{display:inline-flex;align-items:center;gap:6px;margin:7px 14px 7px 0;font-weight:400}.check input{width:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #e8eeeb;vertical-align:middle}th{font-size:11px;color:var(--muted)}.tag{border-radius:30px;background:var(--mint);color:var(--green);padding:4px 9px;font-size:11px;font-weight:700}.muted{color:var(--muted)}.error{color:#aa3030}.notice{background:#fff7e7;border:1px solid #efdfb6;border-radius:8px;padding:11px;margin:12px 0;color:#795a25}.login{max-width:430px;margin:10vh auto;padding:32px}.hide{display:none!important}.item{border-bottom:1px solid var(--border);padding:14px 0}.item:last-child{border:0}pre{white-space:pre-wrap;font:inherit;padding:12px;border-radius:7px}.old{background:#ffeded;color:#8b2828}.new{background:#e9f7ed;color:#176b3b}iframe{width:100%;height:570px;border:1px solid var(--border);border-radius:8px}@media(max-width:700px){.row{display:block}.row>*{margin-bottom:16px}main{padding:18px}header{padding:14px}nav{padding:10px}}
</style></head><body><header><div class="brand">HILLSIDE RESORT BODRUM<small>KALİTE YÖNETİM SİSTEMİ</small></div><div id="identity"></div></header><nav id="nav" class="hide"></nav><main id="app"></main><script src="/bridge.js"></script></body></html>
