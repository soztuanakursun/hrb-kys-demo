<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HILLSIDE RESORT BODRUM | KALİTE YÖNETİM SİSTEMİ</title><style>
:root{

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#24364f;font-family:Aptos,"Segoe UI",Arial,sans-serif;text-transform:uppercase}
button,input,select,textarea{font:inherit;text-transform:uppercase}
button{cursor:pointer}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
.sidebar{background:#edf7f4;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:18px}

.main{padding:20px 24px}

.tabs{display:flex;border-bottom:1px solid var(--line);background:#f7f8fa;border-radius:16px 16px 0 0;overflow:auto}

.subtools{display:flex;justify-content:space-between;align-items:center;padding:12px 12px 6px 12px;gap:8px;flex-wrap:wrap}

.scroll{max-height:58vh;overflow:auto}

.modal{width:min(1180px,96vw);max-height:94vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.18)}

.modal-title{font-size:20px;font-weight:900;color:var(--accent)}
.modal-body{padding:18px 20px}
.close{font-size:28px;border:0;background:none;color:#6f7b90}
.dual{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fbfcfe}
.box h3{margin:0 0 8px 0;font-size:14px;color:var(--accent)}
.box pre{margin:0;white-space:pre-wrap;word-break:break-word;line-height:1.55;font-family:Aptos,"Segoe UI",Arial,sans-serif}
.note{background:#f7f9fc;border:1px solid var(--line);border-radius:12px;padding:12px;color:#56647a;font-size:12px;line-height:1.6}
.empty{padding:34px 18px;color:#758196;text-align:center;font-weight:700}
.list-lines .line{padding:10px 0;border-bottom:1px solid #edf0f4}
.highlight{background:#fff8e8;border-color:#f1dfa5}
@media(max-width:1100px){.row{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.app{grid-template-columns:1fr}.sidebar{display:none}.main{padding:14px}.stats{grid-template-columns:1fr}.field-grid,.field-grid.three,.dual{grid-template-columns:1fr}.user-box select{min-width:160px}}
.color-guide{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.legend{display:flex;align-items:center;gap:7px;font-size:11px;padding:8px;border:1px solid var(--line);border-radius:8px}.legend i{width:18px;height:18px;display:inline-block;border-radius:4px;border:1px solid #aeb8c0;flex-shrink:0}.modal textarea,.modal pre{font-family:Aptos,"Segoe UI",Arial,sans-serif}.modal pre{user-select:text;cursor:text} @media(max-width:650px){.color-guide{grid-template-columns:1fr}}

/* Fit every page to the available viewport; keep all columns visible. */
.app{grid-template-columns:minmax(0,1fr)}

.cal-table col:nth-child(1){width:4%}.cal-table col:nth-child(2){width:9%}.cal-table col:nth-child(3){width:8%}.cal-table col:nth-child(4){width:15%}.cal-table col:nth-child(5){width:7%}.cal-table col:nth-child(6){width:7%}.cal-table col:nth-child(7){width:7%}.cal-table col:nth-child(8){width:8%}.cal-table col:nth-child(9){width:16%}.cal-table col:nth-child(10){width:19%}

@media(max-width:900px){
/* Tables become labelled cards rather than cutting off information. */
.responsive-table,.responsive-table tbody,.responsive-table tfoot,.responsive-table tr,.responsive-table td{display:block;width:100%}
.responsive-table colgroup,.responsive-table thead{display:none}
.responsive-table tr{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;padding:8px;background:var(--surface)}

.responsive-table tr:last-child td:last-child{border-bottom:0}.responsive-table tfoot td{background:transparent}
.scroll{max-height:none;overflow:visible}
.calendar-cards{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:600px){

}
